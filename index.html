<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エゴグラム診断 | プロファイリング</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#1e293b; --accent:#3b82f6; --bg:#f1f5f9; --white:#ffffff; }
        body { font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:#334155;margin:0;line-height:1.8;}
        .wrapper { max-width:850px;margin:0 auto;background:var(--white);box-shadow:0 10px 25px rgba(0,0,0,0.05);}
        .hero-banner { width: 100%; display: block; background:#1e293b;}
        .hero-banner img { width: 100%; height: auto; display: block; border-bottom: 4px solid var(--accent); }
        .main-content { padding:40px;}
        header { text-align:center;margin-bottom:40px;}
        h1 { font-size:1.8rem;color:var(--primary); margin-bottom: 10px;}
        .q-card { background:#fff;padding:25px;border-radius:16px;margin-bottom:20px;border:1px solid #e2e8f0; transition: 0.3s;}
        .q-card.answered { border-left:8px solid var(--accent); background: #f8fafc;}
        .q-text { font-size:1.1rem;font-weight:700;margin-bottom:20px;display:block;}
        .options { display:flex;gap:12px;}
        .opt-btn { flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;cursor:pointer;font-weight:bold; transition: 0.2s; text-align: center;}
        .opt-btn.active { background:var(--accent);color:white;border-color:var(--accent);}
        #diagnose-trigger { display:none;text-align:center;padding:50px 0;}
        .btn-submit { padding:20px 80px;font-size:1.3rem;font-weight:bold;border-radius:50px;border:none;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;cursor:pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3);}
        #result-section { display:none;padding:50px 40px;border-top:4px solid var(--accent); background: #fff;}
        .res-type { font-size:1.8rem;color:var(--accent);font-weight:900; text-align:center; margin: 20px 0;}
        .chart-box { height:400px; margin-bottom:30px; background: #fff9e6; padding: 20px; border-radius: 10px; border: 1px solid #fed7aa;}
        .advice-box { background:#f8fafc;padding:35px;border-radius:20px;border:1px solid #e2e8f0;white-space:pre-wrap; font-size: 0.95rem; line-height: 1.8;}
        .advice-title { font-weight:800;font-size:1.3rem;margin-bottom:15px;color:var(--primary); border-bottom: 2px solid var(--accent); display: inline-block;}
        .remaining { position: sticky; top: 0; background: rgba(241,245,249,0.95); padding: 15px; z-index: 100; text-align:center;font-weight:bold;color:var(--accent); border-bottom: 1px solid #ddd;}
    </style>
</head>
<body>

<div class="wrapper">
    <div class="hero-banner">
        <img src="https://raw.githubusercontent.com/t3takahashit3-cell/ego2/main/egotitle.png" alt="診断タイトル">
    </div>
    <div class="main-content">
        <header>
            <h1>簡易エゴグラムチェックリスト</h1>
            <p>50の質問から、あなたの心のバランスを分析します</p>
        </header>
        <div class="remaining" id="remaining-count">質問を読み込んでいます...</div>
        <div id="questions-container"></div>
        <div id="diagnose-trigger">
            <button class="btn-submit" id="calc-btn">診断結果を解析する</button>
        </div>
        <div id="result-section">
            <div id="res-type-name" class="res-type"></div>
            <div class="chart-box"><canvas id="egogramChart"></canvas></div>
            <div class="advice-box">
                <div class="advice-title">分析結果とアドバイス</div>
                <div id="res-description"></div>
            </div>
            <div style="text-align:center;margin-top:30px;">
                <button class="opt-btn" onclick="location.reload()" style="max-width:300px; padding: 15px 40px;">もう一度診断する</button>
            </div>
        </div>
    </div>
</div>

<script>
// 質問リスト
const questions = [
    { id:1,text:"してみたいことがたくさんある",cat:"FC"}, { id:2,text:"無駄遣いはしない",cat:"CP"}, { id:3,text:"差し入れや贈り物をするのが好き",cat:"NP"}, { id:4,text:"好奇心が旺盛なほうだ",cat:"FC"}, { id:5,text:"頼まれると断れない",cat:"AC"},
    { id:6,text:"自分のやり方にこだわる",cat:"CP"}, { id:7,text:"他者の意見の根拠を求める",cat:"A"}, { id:8,text:"思ったことが口に出せない",cat:"AC"}, { id:9,text:"思いやりがある",cat:"NP"}, { id:10,text:"好き・嫌いがハッキリしている",cat:"FC"},
    { id:11,text:"弱みをみせない",cat:"CP"}, { id:12,text:"教え方や伝え方がやさしく丁寧である",cat:"NP"}, { id:13,text:"無邪気である",cat:"FC"}, { id:14,text:"問題点や欠点に目が向きやすい",cat:"CP"}, { id:15,text:"情緒的というより理論的",cat:"A"},
    { id:16,text:"つらくても我慢することが多い",cat:"AC"}, { id:17,text:"物事を人に任せず、自分で決めようとする",cat:"CP"}, { id:18,text:"ほかの人の顔色をうかがう",cat:"AC"}, { id:19,text:"ジョークやノリの良さで場を和ませるのが好き",cat:"FC"}, { id:20,text:"感謝の言葉に喜びを感じる",cat:"NP"},
    { id:21,text:"人の承認を求める",cat:"AC"}, { id:22,text:"事実や数字に基づいて判断する",cat:"A"}, { id:23,text:"厳しく教育したほうが本人のためになると思う",cat:"CP"}, { id:24,text:"協調性がある",cat:"AC"}, { id:25,text:"感情的にならずに冷静に話す",cat:"A"},
    { id:26,text:"喜怒哀楽の感情がそのまま出る",cat:"FC"}, { id:27,text:"客観的な立場で意見を言う",cat:"A"}, { id:28,text:"賛成・反対をはっきり言う",cat:"CP"}, { id:29,text:"約束やルール、時間に厳しい",cat:"CP"}, { id:30,text:"「なぜ」そうなのか、理由を検討する",cat:"A"},
    { id:31,text:"「わぁ～」「へぇ～」等の感嘆詞をよく使う",cat:"FC"}, { id:32,text:"世話好きである",cat:"NP"}, { id:33,text:"なげやりな態度をとる",cat:"FC"}, { id:34,text:"責任感が強く、他人に対しても責任感を求める",cat:"CP"}, { id:35,text:"ほかの人が成長していく姿を見るのが好き",cat:"NP"},
    { id:36,text:"わがままだと言われる",cat:"FC"}, { id:37,text:"表情や態度がソフトで親近感を感じさせる",cat:"NP"}, { id:38,text:"計画性がある",cat:"A"}, { id:39,text:"他人の言葉や態度を気にするほうだ",cat:"AC"}, { id:40,text:"合理的にやろうとする",cat:"A"},
    { id:41,text:"慎重に行動する",cat:"AC"}, { id:42,text:"「～すべきである」「～ねばならない」と思う",cat:"CP"}, { id:43,text:"思いついたら行動が早い",cat:"FC"}, { id:44,text:"理想を求める",cat:"CP"}, { id:45,text:"話し合いでは、状況を把握してから発言する",cat:"A"},
    { id:46,text:"してほしいことを気軽に口にする",cat:"FC"}, { id:47,text:"つい甘やかしてしまう",cat:"NP"}, { id:48,text:"相手の気持ちに応えようとする",cat:"AC"}, { id:49,text:"ねぎらいや励ましの言葉をかける",cat:"NP"}, { id:50,text:"自分が悪くもないのに、すぐに謝る",cat:"AC"}
];

// タイプ別データ（添付ファイルに基づき全29種を安全に格納）
const typeData = [
    { name: "タイプ１：CP優位型", v: [18,10,10,6,6], d: `非常に頼りがいがあり、リーダーシップを取っているタイプ。自分にも他人にも妥協しないのが特徴です。規律を重視するため、エゴグラム創始者のデュセイは「狂信的愛国者」と名付けています。責任感もとても強く指導力も高いですが、我道を行く傾向が強く周囲に合わせる事を求めるため、周囲の成長を妨げる側面もあります。` },
    { name: "タイプ２：NP優位型", v: [8,18,10,10,8], d: `世話好きで面倒見がよく、人の細やかな変化に気付くのが得意なタイプです。誰かの役に立つことで喜びを感じますが、時に過保護になり相手の成長を妨げることもあります。` },
    { name: "タイプ３：A優位型", v: [8,10,18,8,8], d: `冷静沈着で論理的。常に先を考えて行動する段取り上手です。感情に振り回されませんが、冷たいと思われたり、考えすぎて行動が遅れることがあります。` },
    { name: "タイプ４：FC優位型", v: [6,10,10,18,6], d: `好きなことに一直線で感性豊か。楽しみを見つける天才でマイナス思考が少ないです。行動力は抜群ですが、その場の空気に流されやすい面もあります。` },
    { name: "タイプ５：AC優位型", v: [6,8,10,8,18], d: `順応性が高く、周囲との摩擦を避ける平和主義者です。自己主張が苦手で、他人の顔色を窺いすぎてストレスを溜めやすい傾向があります。` },
    { name: "タイプ６：CP低位型", v: [4,14,14,14,14], d: `自分にも他人にも優しくおおらか。細かいことは気にしないタイプです。責任や規律には少しルーズですが、他人に助けてもらえる愛嬌があります。` },
    { name: "タイプ７：NP低位型", v: [18,4,10,10,18], d: `自分にも他人にも厳しく、思いやりを出すのが苦手なため人間関係で苦労しやすいタイプです。責任感は強く、一匹狼として力を発揮します。` },
    { name: "タイプ８：A低位型（V型）", v: [18,8,4,8,18], d: `責任感が強い反面、自分の本音を抑えて周囲に合わせるため、非常に強い葛藤とストレスを抱えています。休むことに罪悪感を感じやすいです。` },
    { name: "タイプ９：FC低位型", v: [18,18,14,4,18], d: `仕事はきっちりこなし上司にも忠実ですが、自分自身が楽しむことを忘れてしまいがち。仕事中毒になりやすい「中間管理職」タイプです。` },
    { name: "タイプ１０：AC低位型", v: [18,14,14,14,4], d: `自信に満ちたリーダータイプ。指導力があり慕われますが、マイペースで周囲に合わせない「俺についてこい」型です。` },
    { name: "タイプ１１：台形型Ⅰ", v: [8,18,18,18,8], d: `自他肯定型。他人を思いやり、かつ自分の人生も楽しめるバランスの取れたタイプです。人間関係は非常に円滑です。` },
    { name: "タイプ１２：台形型Ⅱ", v: [6,18,18,6,6], d: `献身的に他人に尽くす「ナイチンゲール」タイプ。自己主張は控えめで、周囲に安心感を与えます。` },
    { name: "タイプ１３：台形型Ⅲ", v: [6,6,18,18,6], d: `自分の世界を大切にするタイプ。論理的で趣味にも没頭しますが、他人への関心が薄く、自分勝手に見られてしまうことがあります。` },
    { name: "タイプ１４：U型Ⅰ", v: [18,8,4,8,18], d: `厳格さと従順さが同居しており、心の中で常に自分を責めているようなストレスフルな状態です。非常に生きづらさを感じやすいです。` },
    { name: "タイプ１５：U型Ⅱ", v: [18,8,4,18,18], d: `情熱的ですが感情のブレーキが効きにくく、衝動的に怒りを爆発させて後で激しく後悔することが多いタイプです。` },
    { name: "タイプ１６：U型Ⅲ", v: [18,18,4,8,18], d: `自己犠牲精神が強いですが、内面は非常に苦しいタイプ。他人に尽くすことで自分の価値を見出そうとしますが、無理がたたりやすいです。` },
    { name: "タイプ１７：N型Ⅰ", v: [6,18,4,12,18], d: `とにかく優しすぎて断れないタイプ。周囲からは重宝されますが、本人はパンク寸前まで仕事を抱え込みがちです。` },
    { name: "タイプ１８：N型Ⅱ", v: [6,18,10,10,18], d: `他人のニーズに敏感で尽くしますが、依存関係に陥りやすい傾向があります。自分の幸せを後回しにしがちです。` },
    { name: "タイプ１９：N型Ⅲ", v: [6,18,18,6,18], d: `「働き者」の鑑。能力は高いですが、不安が強く他人の評価を気にしすぎて疲れ果ててしまうタイプです。` },
    { name: "タイプ２０：逆N型Ⅰ", v: [18,6,18,6,6], d: `「頑固な警察官」タイプ。正義感が強く有能ですが、冷徹に見られがちで、部下や周囲に対して厳しすぎることがあります。` },
    { name: "タイプ２１：逆N型Ⅱ", v: [18,6,10,18,6], d: `「プレイボーイ（ドンファン）」タイプ。自由奔放で魅力的ですが、自分勝手でわがままな面が強く出ます。` },
    { name: "タイプ２２：逆N型Ⅲ", v: [18,6,6,18,6], d: `エネルギッシュですが無計画。感情のままに動いては周囲に迷惑をかけることがあり、客観性に欠ける面があります。` },
    { name: "タイプ２３：M型", v: [6,18,10,18,6], d: `「笑顔型」。明るく社交的で、誰からも愛される人気者です。少しルーズな面もありますが、人生を謳歌しています。` },
    { name: "タイプ２４：W型", v: [18,6,18,6,18], d: `要注意のパターン。内面に強い不満と怒りを溜め込んでおり、自分も他人も否定的に見てしまいがちな苦しい状態です。` },
    { name: "タイプ２５：P優位型", v: [18,18,10,8,6], d: `理想的な親・上司タイプ。厳しさと優しさを使い分け、周囲を力強く導いていくことができます。` },
    { name: "タイプ２６：C優位型", v: [6,8,10,18,18], d: `甘え上手で無邪気な子供のようなタイプ。周囲に可愛がられますが、自己管理能力に欠け、依存心が高いです。` },
    { name: "タイプ２７：平坦型Ⅰ", v: [18,18,18,18,18], d: `超エネルギッシュ。何事にも全力ですが、オーバーワークでの突然のダウンに注意が必要です。` },
    { name: "タイプ２８：平坦型Ⅱ", v: [10,10,10,10,10], d: `ニュートラルで安定していますが、個性に欠ける面があります。周囲との摩擦は最も少ないタイプです。` },
    { name: "タイプ２９：平坦型Ⅲ", v: [4,4,4,4,4], d: `エネルギーが枯渇している状態です。今は無理をせず、心身を休めることを最優先にしてください。` }
];

let userAns = {};

// 起動関数
function startApp() {
    const container = document.getElementById("questions-container");
    if (!container) return;

    container.innerHTML = "";
    questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "q-card";
        div.id = `q-${q.id}`;
        div.innerHTML = `
            <span class="q-text">Q${q.id}. ${q.text}</span>
            <div class="options">
                <button class="opt-btn" onclick="selectAns(${q.id},2,this)">はい</button>
                <button class="opt-btn" onclick="selectAns(${q.id},1,this)">どちらでもない</button>
                <button class="opt-btn" onclick="selectAns(${q.id},0,this)">いいえ</button>
            </div>
        `;
        container.appendChild(div);
    });
    updateRemaining();
}

window.selectAns = function(id, val, btn) {
    userAns[id] = val;
    const parent = btn.parentElement;
    Array.from(parent.children).forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    btn.closest(".q-card").classList.add("answered");
    updateRemaining();
};

function updateRemaining() {
    const count = Object.keys(userAns).length;
    const left = questions.length - count;
    const label = document.getElementById("remaining-count");
    if (left > 0) {
        label.innerText = `残り ${left} 問です`;
        document.getElementById("diagnose-trigger").style.display = "none";
    } else {
        label.innerText = "すべての質問に回答しました！";
        document.getElementById("diagnose-trigger").style.display = "block";
    }
}

document.getElementById("calc-btn").onclick = function() {
    const score = { CP:0, NP:0, A:0, FC:0, AC:0 };
    questions.forEach(q => {
        score[q.cat] += (userAns[q.id] || 0);
    });

    const best = findType(score);
    document.getElementById("res-type-name").innerText = best.name;
    document.getElementById("res-description").innerText = best.d;
    document.getElementById("result-section").style.display = "block";
    showChart(score);
    document.getElementById("result-section").scrollIntoView({behavior:"smooth"});
};

function findType(s) {
    const u = [s.CP, s.NP, s.A, s.FC, s.AC];
    let min = Infinity;
    let match = typeData[0];
    typeData.forEach(t => {
        let diff = 0;
        t.v.forEach((val, i) => { diff += Math.pow(u[i] - val, 2); });
        if (diff < min) { min = diff; match = t; }
    });
    return match;
}

function showChart(s) {
    const ctx = document.getElementById("egogramChart").getContext("2d");
    if (window.myChart) window.myChart.destroy();
    window.myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ["CP", "NP", "A", "FC", "AC"],
            datasets: [{
                data: [s.CP, s.NP, s.A, s.FC, s.AC],
                borderColor: '#3b82f6',
                borderWidth: 4,
                pointRadius: 6,
                fill: false,
                tension: 0
            }]
        },
        options: {
            scales: { y: { min: 0, max: 20 } },
            plugins: { legend: { display: false } }
        }
    });
}

// 読み込み完了時に実行
if (document.readyState === 'complete') {
    startApp();
} else {
    window.onload = startApp;
}
</script>
</body>
</html>
